name: Reusable Docker Security Scan (Trivy)

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Docker image name to scan (e.g., ghcr.io/owner/repo:tag)'
        type: string
        required: false
      dockerfile-path:
        description: 'Path to Dockerfile'
        type: string
        default: 'Dockerfile'
        required: false
      build-context:
        description: 'Build context path'
        type: string
        default: '.'
        required: false
      scan-type:
        description: 'Trivy scan type: fs (filesystem) or image'
        type: string
        default: 'fs'
        required: false
      severity:
        description: 'Comma-separated severity levels to report'
        type: string
        default: 'CRITICAL,HIGH'
        required: false
    secrets:
      GITHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.build-context }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner (Filesystem)
        if: inputs.scan-type == 'fs'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ inputs.severity }}

      - name: Run Trivy vulnerability scanner (Docker Image)
        if: inputs.scan-type == 'image' && inputs.image-name != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'image'
          scan-ref: ${{ inputs.image-name }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ inputs.severity }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@7fd177fa680c9881b53cdab4d346d32574c9f7f4 # v3.35.4
        with:
          sarif_file: 'trivy-results.sarif'