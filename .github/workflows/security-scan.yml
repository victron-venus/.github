name: 'Security Scan'
# CodeQL is required by the org "Default" ruleset (code_scanning rule,
# tool: CodeQL) — without it PRs block on "Waiting for Code Scanning
# results". Thin wrapper around the toolkit reusable workflow; this repo
# is a static site, so only the JavaScript analysis runs.

on:
  workflow_call: {}

permissions:
  contents: read
  # CodeQL in the reusable workflow uploads SARIF — the caller must allow
  # it or the run dies as a startup_failure with no logs.
  security-events: write
  actions: read

jobs:
  security-scan:
    name: Security Scan
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@64778cbbbe5bb9ac4444a91e1140bd41c5fe4a7f
    with:
      languages: 'javascript'
      run-codeql: true
      run-trivy: false
      run-dependency-review: false
