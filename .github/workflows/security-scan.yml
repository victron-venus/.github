name: 'Security Scan'
# CodeQL is required by the org "Default" ruleset (code_scanning rule,
# tool: CodeQL) — without it PRs block on "Waiting for Code Scanning
# results". Thin wrapper around the toolkit reusable workflow; this repo
# is a static site, so only the JavaScript analysis runs.

on:
  workflow_call: {}

permissions:
  contents: read
  actions: read

jobs:
  security-scan:
    name: Security Scan
    # The reusable CodeQL job uploads SARIF; other jobs inherit read-only access.
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@b93b2e5dd29237f254e5273acf91272abbcd33d9
    with:
      languages: 'javascript'
      run-codeql: true
      run-trivy: false
      run-dependency-review: false
